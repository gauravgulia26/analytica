[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "analytica"
version = "0.0.1"
description = "**Analytica** is a modular multi-agent AI system for automated data analysis. Built with LangGraph, it orchestrates specialized agents for data exploration, Python analysis, statistical reasoning, visualization, and insight generation through a centralized workflow."
authors = [
  { name = "Gourav Gulia" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "grandalf>=0.8",
    "ipython",
    "jupyterlab",
    "langchain>=1.3.18",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["analytica"]
include = ["pyproject.toml", "analytica/**/*.py"]

[tool.ruff.lint]
extend-select = ["I","E","F"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["analytica"]
force-sort-within-sections = true

